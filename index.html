<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Skeleton">
<meta name="theme-color" content="#edf1f4">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Skeleton Log</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top,0px); padding-bottom: env(safe-area-inset-bottom,0px); }
:root {
  --bg: #edf1f4; --surface: #ffffff; --surface-2: #f4f7f9; --ink: #0e1d29; --muted: #566877; --line: #d6dee5;
  --accent: #0a6e96; --accent-ink: #ffffff; --accent-soft: #dbedf5;
  --best: #7a3fc2; --best-soft: #ece1f9; --good: #1b7f47; --amber: #c28a00; --good-soft: #dff2e6;
  --bad: #bf2f2f; --bad-soft: #fbe4e4;
  --s0: #0a6e96; --s1: #cf7a1d; --s2: #2a8f80;
  --font-display: "Big Shoulders Display", "Arial Narrow", sans-serif;
  --font-body: "Instrument Sans", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09121a; --surface: #111e28; --surface-2: #16262f; --ink: #e5eef4; --muted: #8ea2b1; --line: #25394a;
    --accent: #4cb8e6; --accent-ink: #04202e; --accent-soft: #123446;
    --amber: #f2c14e; --best: #b794f0; --best-soft: #2a1d44; --good: #4cc783; --good-soft: #12372a; --bad: #ff8585; --bad-soft: #3d1c1c;
    --s0: #4cb8e6; --s1: #f0a255; --s2: #4fc2b1; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09121a; --surface: #111e28; --surface-2: #16262f; --ink: #e5eef4; --muted: #8ea2b1; --line: #25394a;
  --accent: #4cb8e6; --accent-ink: #04202e; --accent-soft: #123446;
  --amber: #f2c14e; --best: #b794f0; --best-soft: #2a1d44; --good: #4cc783; --good-soft: #12372a; --bad: #ff8585; --bad-soft: #3d1c1c;
  --s0: #4cb8e6; --s1: #f0a255; --s2: #4fc2b1; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.4; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.wrap { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left,0px)); padding-right: max(16px, env(safe-area-inset-right,0px)); padding-bottom: 110px; }

.top { position: sticky; top: env(safe-area-inset-top,0px); z-index: 5; background: var(--bg); padding-top: 14px; }
.brand { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: .02em; text-transform: uppercase; margin: 0; line-height: 1; }
.brand .sp { flex: 1; }
.sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.sync.local::before { background: var(--s1); }
.sync.busy::before { background: var(--accent); }
.trackpick { display: flex; gap: 8px; align-items: center; }
.trackpick select { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font-weight: 600; }
.tabs { display: flex; gap: 4px; margin-top: 12px; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; padding: 10px 14px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

main { padding-top: 18px; display: flex; flex-direction: column; gap: 18px; }
.eyebrow { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 22px; text-transform: uppercase; letter-spacing: .03em; margin: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px; font-weight: 600; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); }
.btn.small { padding: 6px 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.icechip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }

.hero { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hero .card { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.big { font-family: var(--font-display); font-weight: 800; font-size: 56px; line-height: .95; letter-spacing: .01em; font-variant-numeric: tabular-nums; }
.big small { font-size: 22px; font-weight: 700; color: var(--muted); margin-left: 4px; }
.hero .pb .big { color: var(--good); }
.hero .vb .big { color: var(--best); }
.sub { font-size: 13px; color: var(--muted); }
.strip { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.strip > div { padding: 12px 14px; border-left: 1px solid var(--line); min-width: 0; }
.strip > div:first-child { border-left: 0; }
.strip .v { font-family: var(--font-display); font-weight: 700; font-size: 28px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.chartcard { padding: 14px 14px 10px; }
.chartcard .head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
.chartwrap { display: flex; align-items: flex-start; }
.yaxis { flex: none; width: 40px; }
.yaxis svg { display: block; }
.chartscroll { flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
.xcap { text-align: center; margin-top: 2px; }
.legend { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; align-items: center; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; background: var(--c); }
.legend i.lg-pb { background: var(--good-soft); border: 1.5px solid var(--good); }
.legend i.lg-hollow { background: none; border: 1.5px solid var(--accent); }
.lg-x { color: var(--bad); font-size: 14px; margin-right: 5px; line-height: 1; }
.hit { cursor: pointer; outline: none; }
.hit:focus-visible circle:nth-of-type(2) { stroke: var(--accent); stroke-width: 2.5; }
#chart svg { display: block; }
.tblwrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 10px 8px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
th.n, td.n { text-align: right; }
.sectotal td { font-weight: 600; border-top: 2px solid var(--line); }
.ro td.dif { color: var(--muted); font-size: 13px; }
.ro .good { color: var(--good); font-weight: 600; background: var(--good-soft); border-radius: 5px; padding: 2px 6px; margin-right: -6px; }
.ro td.lbl { color: var(--muted); font-weight: 500; width: 1%; padding-right: 24px; }
.ro td.wrap { white-space: normal; }

.dayhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 0 2px 8px; flex-wrap: wrap; }
.dayhead h3 { margin: 0; font-family: var(--font-display); font-size: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
.day { display: flex; flex-direction: column; gap: 0; margin-bottom: 18px; }
.sess { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 8px 14px 4px; }
.runs { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: visible; }
.runwrap { position: relative; border-top: 1px solid var(--line); }
.runwrap:first-child { border-top: 0; }
.runwrap:first-child > .run { border-radius: 10px 10px 0 0; }
.runwrap:last-child > .run { border-radius: 0 0 10px 10px; }
.runwrap.ed > .run { padding-right: 48px; }
.runkebab { position: absolute; top: 4px; right: 6px; }
.run { display: grid; grid-template-columns: 34px 46px 1fr auto; gap: 2px 10px; align-items: center; width: 100%; text-align: left; background: none; border: 0; padding: 11px 14px; }
.run:hover { background: var(--surface-2); }
.rn { color: var(--muted); font-family: var(--font-mono); font-size: 13px; }
.st { font-family: var(--font-mono); font-size: 12px; font-weight: 600; border: 1.5px solid var(--c); color: var(--c); border-radius: 5px; padding: 1px 0; text-align: center; }
.ft { font-family: var(--font-mono); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.ft.dnf { color: var(--bad); font-size: 16px; }
.ft.nt { color: var(--muted); font-size: 14px; font-weight: 500; }
.tag { font-family: var(--font-body); font-size: 10px; font-weight: 700; letter-spacing: .06em; border-radius: 4px; padding: 2px 5px; margin-left: 6px; vertical-align: 3px; white-space: nowrap; display: inline-block; }
.tag.pb { background: var(--good-soft); color: var(--good); }
.tag.dayb { background: var(--accent-soft); color: var(--accent); }
.ice { display: inline-flex; align-items: center; gap: 4px; }
.ico { flex: none; }
.dl { font-family: var(--font-mono); font-size: 13px; color: var(--muted); text-align: right; }
.meta { grid-column: 3 / 5; display: flex; gap: 6px 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.note { grid-column: 3 / 5; font-size: 13px; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty h2 { color: var(--ink); }

/* pistas */
.tlist { display: flex; flex-direction: column; gap: 10px; }
.tcard { position: relative; display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.tcard:hover { border-color: var(--accent); }
.tthumb { flex: none; width: 96px; height: 72px; border-radius: 8px; background: #202321; overflow: hidden; display: flex; align-items: center; justify-content: center; }
.tthumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
.thumbbtn { border: 0; background: none; padding: 0; width: 100%; height: 100%; }
.nothumb { color: #8ea2b1; font-size: 11px; text-align: center; padding: 0 6px; }
.tinfo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.tcard.ed .tinfo { padding-right: 30px; }
.tname { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tname b { font-family: var(--font-display); font-size: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; line-height: 1.1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flag { width: 20px; height: 15px; object-fit: cover; border-radius: 2px; box-shadow: 0 0 0 1px var(--line); flex: none; }
.tstats { display: flex; gap: 22px; flex-wrap: wrap; }
.tstats > span { display: flex; flex-direction: column; gap: 2px; }
.tstats b { font-size: 17px; font-weight: 600; }
.kebab { position: absolute; top: 6px; right: 6px; }
.kbtn { background: none; border: 0; padding: 6px; border-radius: 8px; color: var(--muted); display: flex; }
.kbtn:hover { background: var(--surface-2); color: var(--ink); }
.kmenu { position: absolute; top: 100%; right: 0; z-index: 8; min-width: 170px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.22); overflow: hidden; }
.kmenu button { display: block; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 11px 14px; font-weight: 600; font-size: 14px; }
.kmenu button:first-child { border-top: 0; }
.kmenu button:hover { background: var(--surface-2); }
.kmenu button.danger { color: var(--bad); }

.fab { position: fixed; right: max(16px, env(safe-area-inset-right,0px)); bottom: calc(16px + env(safe-area-inset-bottom,0px)); z-index: 6; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 14px 22px; font-weight: 600; font-size: 16px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }

.bg { position: fixed; inset: 0; z-index: 20; background: rgba(5,12,18,.55); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 94%; overflow-y: auto; border-radius: 14px 14px 0 0; padding: 18px max(16px, env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)); display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 640px) { .bg { align-items: center; } .sheet { border-radius: 14px; max-height: 90%; } }
.sh-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.x { background: none; border: 0; font-size: 26px; line-height: 1; padding: 4px 8px; color: var(--muted); }
.f2 { display: grid; grid-template-columns: 1.7fr 1fr 1fr; gap: 10px; }
.f2.two { grid-template-columns: 1fr 1fr; }
label.fld { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; min-width: 0; }
label.fld.tf { color: var(--ink); font-size: 13px; }
.in { background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; min-width: 0; font-size: 16px; color: var(--ink); }
.in:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px var(--accent-soft); }
textarea.in { resize: vertical; min-height: 64px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: var(--surface-2); border: 0; border-left: 1px solid var(--line); padding: 9px 6px; font-weight: 600; font-size: 14px; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button.bad[aria-pressed="true"] { background: var(--bad); color: #fff; }
.tgrid { display: grid; grid-template-columns: 1fr 110px 80px; gap: 6px 10px; align-items: center; }
.tgrid .h { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.tgrid .lab { font-weight: 600; font-size: 14px; }
.tgrid .lab small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
.tgrid .in { font-family: var(--font-mono); text-align: right; padding: 7px 10px; }
.tgrid .in.bad { border-color: var(--bad); }
.sec { font-family: var(--font-mono); font-size: 14px; text-align: right; padding: 3px 6px; border-radius: 5px; }
.sec.best { background: var(--best-soft); color: var(--best); font-weight: 600; }
.sec.near { background: var(--good-soft); color: var(--good); }
.sec.neg { background: var(--bad-soft); color: var(--bad); }
.err { color: var(--bad); font-size: 13px; }
.warn { color: var(--bad); font-size: 12px; }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.foot { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.foot .sp { flex: 1; }
.mapbox { background: #202321; border-radius: 10px; display: flex; justify-content: center; padding: 12px; min-height: 120px; align-items: center; }
.mapbox img { max-width: 100%; max-height: 62vh; display: block; }

.gate { max-width: 440px; margin: 32px auto 0; display: flex; flex-direction: column; gap: 12px; }
.gate .in { font-family: var(--font-mono); letter-spacing: .04em; }

.dgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.dgrid .card { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.imp { display: flex; flex-direction: column; gap: 12px; width: 100%; }
.impsheet { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--surface-2); }
.impsheet h4 { margin: 0; font-size: 15px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom,0px)); z-index: 30; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-size: 14px; max-width: calc(100% - 32px); }

@media (max-width: 560px) {
  .big { font-size: 40px; }
  .big small { font-size: 18px; }
  .hero { gap: 8px; }
  .hero .card { padding: 14px 12px; }
  .strip > div { padding: 10px; }
  .strip .v { font-size: 24px; }
  .dgrid { grid-template-columns: 1fr; }
  .tgrid { grid-template-columns: 1fr 96px 64px; }
  .tabs { gap: 0; }
  .tab { flex: 1; padding: 10px 6px; font-size: 14px; text-align: center; }
  .tthumb { width: 84px; height: 64px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Skeleton Log</h1><span class="sp"></span><span class="sync" id="sync"></span></div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="resumen">Resumen</button>
      <button class="tab" role="tab" data-tab="descensos">Descensos</button>

      <button class="tab" role="tab" data-tab="datos">Datos</button>

  <main id="view"></main>
</div>

<div class="bg" id="sheetbg" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

  function startColor(t, s) { var i = startsOf(t).indexOf(s); return 'var(--s' + (i < 0 ? 0 : i % 3) + ')'; }

  /* ---------- Gráfico (deslizable) ---------- */
  var CH = { H: 250, L: 40, R: 12, T: 28, B: 36, PX: 16, STEP: 28 };
  var chartLeft = 0, chartAtEnd = true, chartKey = null;

  // Récords en cada momento: PB (mejor tiempo final) y VB (suma de mejores parciales).
  function chartSeries(runs, k) {
    var secBest = [], pb = null, vb = null, pbPts = [], vbPts = [], j;
    for (j = 0; j < k; j++) secBest.push(null);
    runs.forEach(function (r, i) {
      var f = finishOf(r);
      if (f != null && (pb == null || f < pb)) { pb = f; pbPts.push({ i: i, v: f, r: r }); }
      sectors(r).forEach(function (s, q) { if (s != null && q < k && (secBest[q] == null || s < secBest[q])) secBest[q] = s; });
      if (k && secBest.every(function (b) { return b != null; })) {
        var v = Math.round(secBest.reduce(function (a, b) { return a + b; }, 0) * 1000) / 1000;
        if (vb == null || v < vb - 0.0005) { vb = v; vbPts.push({ i: i, v: v, r: r }); }
      }
    });
    return { pb: pbPts, vb: vbPts };
  }
  function linePath(pts, xs, ys, lastI) {
    if (!pts.length) return '';
    var d = 'M' + xs(pts[0].i).toFixed(1) + ' ' + ys(pts[0].v).toFixed(1);
    for (var q = 1; q < pts.length; q++) d += 'L' + xs(pts[q].i).toFixed(1) + ' ' + ys(pts[q].v).toFixed(1);
    return d + 'H' + xs(lastI).toFixed(1);

  function drawChart(t) {
    var box = $('chart'), sc = $('chartScroll'), yb = $('chartY'); if (!box || !sc || !yb) return;
    var ref0 = t.ref || '', st = stats(t, ref0), k = t.splits.length;
    var runs = runsOf(t.id).filter(function (r) { return !ref0 || r.start === ref0; });
    var pts = runs.filter(function (r) { return finishOf(r) != null; });
    var ser = chartSeries(runs, k), pbIds = {};
    ser.pb.forEach(function (p, q) { if (q) pbIds[p.r.id] = true; });
    var nDnf = runs.filter(function (r) { return r.status === 'dnf'; }).length;
    var nNt = runs.filter(function (r) { return finishOf(r) == null && r.status !== 'dnf'; }).length;
    var lg = $('legend');
    if (lg) lg.innerHTML = '<span><i style="--c:var(--accent)"></i>Descenso</span>' +
      (ser.pb.length ? '<span><i class="lg-pb"></i>Personal Best</span>' : '') +
      (ser.vb.length ? '<span><i style="--c:var(--best)"></i>Virtual Best</span>' : '') +
      (nNt ? '<span><i class="lg-hollow"></i>Sin tiempo</span>' : '') +
      (nDnf ? '<span><b class="lg-x">×</b>DNF</span>' : '');
    var cap = $('chartCap');
    if (pts.length < 2) { yb.hidden = true; yb.innerHTML = ''; box.innerHTML = '<p class="sub">Con dos descensos con tiempo ya se dibuja la evolución.</p>'; if (cap) cap.hidden = true; return; }
    if (cap) cap.hidden = false;
    yb.hidden = false;

          (s.target === 'new' ? '<label class="fld">NOMBRE DE LA PISTA<input class="in" data-impname="' + i + '" value="' + esc(s.newName) + '"></label>' :
            '<label class="fld">SI YA HAY DATOS<select class="in" data-impmode="' + i + '"><option value="add"' + (s.mode === 'add' ? ' selected' : '') + '>Añadir solo los nuevos</option><option value="replace"' + (s.mode === 'replace' ? ' selected' : '') + '>Reemplazar todos los de la pista</option></select></label>') + '</div>' +
          '<div class="sub">' + (s.include ? 'Se añadirán <b>' + c.add + '</b>' + (c.dup ? ' · ' + c.dup + ' ya existen y se omiten' : '') + (c.repl ? ' · se borrarán ' + c.repl + ' actuales' : '') : 'Omitida') + '</div></div>';
      });
      h += '<div class="row"><button class="btn primary" type="button" data-impgo="1">Importar</button><button class="btn" type="button" data-impcancel="1">Cancelar</button></div></section>';
    }
    return h;
  }
  function applyImport() {
    if (UI.role !== 'editor' || !UI.imp) return;
    var im = UI.imp, n = 0, tracks = 0, rows = [];
    im.sheets.forEach(function (s) {
      if (!s.include) return;
      var tid = s.target, keys = {};
      if (tid === 'new') {
        var name = (s.newName || s.name).trim() || s.name;
        if (trackList().some(function (t) { return norm(t.name) === norm(name); })) name += ' (importada)';
        var doc = { id: uid(), name: name, country: '', splits: s.splits, starts: s.starts, created: Date.now() };
        S.tracks[doc.id] = doc; rows.push(rowOf('tracks', doc)); tid = doc.id; tracks++;
      } else {
        var t = S.tracks[tid], add = s.starts.filter(function (x) { return (t.starts || []).indexOf(x) < 0; });
        if (add.length) { var nt = Object.assign({}, t, { starts: (t.starts || []).concat(add) }); S.tracks[tid] = nt; rows.push(rowOf('tracks', nt)); }
        if (s.mode === 'replace') delDocs('runs', runsOf(tid).map(function (r) { return r.id; }));
        else runsOf(tid).forEach(function (r) { keys[runKey(r)] = 1; });
      }
      s.runs.forEach(function (r) {
        if (keys[runKey(r)]) return;
        var run = Object.assign({ id: uid(), trackId: tid }, r);
        S.runs[run.id] = run; rows.push(rowOf('runs', run)); n++;
      });
      UI.track = tid;
    });
    UI.imp = null; pushRows(rows); render();
    toast('Importados ' + n + ' descensos' + (tracks ? ' y ' + tracks + (tracks === 1 ? ' pista nueva' : ' pistas nuevas') : ''));
  }

  /* ---------- Eventos ---------- */
  document.addEventListener('click', function (e) {
    if (UI.runMenu && !(e.target.closest && e.target.closest('.runkebab'))) { UI.runMenu = null; UI.confirmRun = null; if (UI.role) render(); return; }
    if (UI.menu && !(e.target.closest && e.target.closest('.kebab'))) { UI.menu = null; UI.confirmTrack = null; if (UI.role) render(); return; }
    var cr = e.target.closest && e.target.closest('[data-chartrun]');
    if (cr) { openRunById(cr.getAttribute('data-chartrun')); return; }
    if (e.target === $('sheetbg')) { closeSheet(); return; }
    var b = e.target.closest('button, label.btn');
    if (!b) {
      var tc = e.target.closest('[data-gotrack]');
      if (tc) goTrack(tc.getAttribute('data-gotrack'));
      return;
    }
    var d = b.dataset, t = curTrack();
    if (UI.role !== 'editor' && EDITS.some(function (k) { return d[k] !== undefined; })) return;
    if (d.entercode) { enter($('codein').value.trim()); return; }
    if (d.logout) { logout(); return; }
    if (d.tab) { UI.tab = d.tab; UI.menu = null; try { history.replaceState(null, '', '#' + d.tab); } catch (x) {} render(); window.scrollTo(0, 0); return; }
    if (d.menu) { UI.menu = UI.menu === d.menu ? null : d.menu; UI.confirmTrack = null; render(); return; }
    if (d.runmenu !== undefined) { UI.runMenu = UI.runMenu === d.runmenu ? null : d.runmenu; UI.confirmRun = null; render(); return; }
    if (d.runedit !== undefined) { var er = S.runs[d.runedit]; UI.runMenu = null; UI.confirmRun = null; if (er && t) openEditor(draftFrom(er, t)); else render(); return; }
    if (d.rundel !== undefined) { if (UI.confirmRun === d.rundel) { UI.confirmRun = null; UI.runMenu = null; delDocs('runs', [d.rundel]); render(); toast('Descenso eliminado'); } else { UI.confirmRun = d.rundel; render(); } return; }
    if (d.new && t) { openEditor(newDraft(t)); return; }
    if (d.run) { openRunById(d.run); return; }
    if (d.close) { closeSheet(); return; }
    if (d.newtrack) { UI.ro = null; UI.ed = null; UI.map = null; UI.trk = { id: null, name: '', country: '', splits: '', starts: '', ref: '', img: null, imgChanged: false, err: '' }; drawSheet(); openSheet(); return; }
    if (d.edittrack) {
      var x = S.tracks[d.edittrack]; UI.menu = null; UI.confirmTrack = null;
      UI.ro = null; UI.ed = null; UI.map = null;
      UI.trk = { id: x.id, name: x.name, country: x.country || '', splits: x.splits.join(', '), starts: (x.starts || []).join(', '), ref: x.ref || '', img: (S.trackimgs[x.id] && S.trackimgs[x.id].data) || null, imgChanged: false, err: '' };
      drawSheet(); openSheet(); render(); return;
    }
    if (d.tfimgdel) { readTrackForm(); UI.trk.img = null; UI.trk.imgChanged = true; drawSheet(); return; }
    if (d.map) { UI.ro = null; UI.ed = null; UI.trk = null; UI.map = d.map; drawSheet(); openSheet(); return; }
    if (d.savetrack) { saveTrack(); return; }
    if (d.deltrack) { if (UI.confirmTrack === d.deltrack) { UI.confirmTrack = null; deleteTrack(d.deltrack); } else { UI.confirmTrack = d.deltrack; render(); } return; }
    if (UI.ed) {
      if (d.status) { readDraft(); UI.ed.status = d.status; drawSheet(); return; }
      if (d.type !== undefined) { readDraft(); UI.ed.type = d.type; drawSheet(); return; }
      if (d.pickstart !== undefined) { readDraft(); UI.ed.start = d.pickstart; drawSheet(); return; }
      if (d.ice !== undefined) { readDraft(); UI.ed.ice = UI.ed.ice === d.ice ? '' : d.ice; drawSheet(); return; }
      if (d.save) { saveDraft(d.save); return; }
      if (d.del === '1') { readDraft(); UI.ed.confirmDel = true; drawSheet(); return; }
      if (d.del === '2') { var id = UI.ed.id; closeSheet(); delDocs('runs', [id]); render(); toast('Descenso eliminado'); return; }
    }
    if (d.export) { doExport(); return; }
    if (d.impcancel) { UI.imp = null; render(); return; }
    if (d.impgo) { applyImport(); return; }
  });
  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.id === 'trackSel') { UI.track = el.value; render(); return; }
    if (UI.role !== 'editor') return;
    if (el.id === 'tf-img') {
      var f = el.files && el.files[0]; el.value = '';
      if (f && UI.trk) shrinkImage(f, function (data) {
        if (!UI.trk) return;
        if (!data) { var m = $('tf-imgerr'); if (m) m.textContent = 'No se pudo usar esa imagen. Prueba con otra en PNG o JPG.'; return; }
        readTrackForm(); UI.trk.img = data; UI.trk.imgChanged = true; drawSheet();
      });
      return;
    }
    if (el.id === 'impfile') { if (el.files && el.files[0]) handleFile(el.files[0]); el.value = ''; return; }
    if (!UI.imp) return;
    var ds = el.dataset;
    if (ds.impinc !== undefined) { UI.imp.sheets[+ds.impinc].include = el.checked; render(); }
    else if (ds.imptarget !== undefined) { UI.imp.sheets[+ds.imptarget].target = el.value; render(); }
    else if (ds.impmode !== undefined) { UI.imp.sheets[+ds.impmode].mode = el.value; render(); }
    else if (ds.impname !== undefined) { UI.imp.sheets[+ds.impname].newName = el.value; }
  });
  document.addEventListener('input', function (e) {
    var el = e.target;
    if (el && (el.id === 'f-temp' || el.id === 'f-speed')) {
      var cv = el.value.replace(/[\u2010-\u2015\u2212\uFE63\uFF0D]/g, '-');
      if (cv !== el.value) { var pos = el.selectionStart; el.value = cv; try { el.setSelectionRange(pos, pos); } catch (x) {} }
    }
    if (UI.ed && el.dataset && el.dataset.ti !== undefined) { UI.ed.t[+el.dataset.ti] = el.value; UI.ed.dupOk = false; refreshSectors(); }
    if (UI.ed && (el.id === 'f-date' || el.id === 'f-n' || el.id === 'f-session')) UI.ed.dupOk = false;
    if (UI.imp && el.dataset && el.dataset.impname !== undefined) UI.imp.sheets[+el.dataset.impname].newName = el.value;
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('sheetbg').hidden) { closeSheet(); return; }
    var el = e.target;
    if (e.key === 'Enter' && el.id === 'codein') { e.preventDefault(); enter(el.value.trim()); return; }
    if ((e.key === 'Enter' || e.key === ' ') && el.getAttribute && el.getAttribute('data-chartrun')) { e.preventDefault(); openRunById(el.getAttribute('data-chartrun')); return; }
    if ((e.key === 'Enter' || e.key === ' ') && el.getAttribute && el.getAttribute('data-gotrack')) { e.preventDefault(); goTrack(el.getAttribute('data-gotrack')); return; }
    if (e.key === 'Enter' && el.dataset && el.dataset.ti !== undefined) {
      e.preventDefault();
      var nx = $('f-t' + (+el.dataset.ti + 1));
      if (nx && !nx.disabled) nx.focus(); else { var sp = $('f-speed'); if (sp) sp.focus(); }
    }
  });
  document.addEventListener('scroll', function (e) {
    var el = e.target;
    if (el && el.id === 'chartScroll') { chartLeft = el.scrollLeft; chartAtEnd = el.scrollLeft + el.clientWidth >= el.scrollWidth - 4; }
  }, true);
  document.addEventListener('dragover', function (e) { if (UI.role === 'editor' && UI.tab === 'datos' && e.dataTransfer && e.dataTransfer.types.indexOf('Files') >= 0) e.preventDefault(); });
  document.addEventListener('drop', function (e) { if (UI.role === 'editor' && UI.tab === 'datos' && e.dataTransfer && e.dataTransfer.files.length) { e.preventDefault(); handleFile(e.dataTransfer.files[0]); } });
  var rz; window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { var t = curTrack(); if (t && UI.tab === 'resumen' && UI.role && !UI.loading) drawChart(t); }, 120); });
  function fromHash() {
    var h = (location.hash || '').slice(1);
    if (h === 'diario') h = 'descensos';
    if (TABS.indexOf(h) >= 0) UI.tab = h;
  }
  window.addEventListener('hashchange', function () { fromHash(); render(); });

  fromHash();
  render();
  boot();
})();
</script>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
</script>
</body>
